# Builds the static site (dist/) and uploads it to Cloudflare Pages on every push to main.
# Setup (once): see "Deploying to Cloudflare Pages" in README.md.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          cp .env.example .env
          php artisan key:generate
          npm ci

      - name: Build static site
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          MOSAIC_TELEGRAM_URL: ${{ vars.MOSAIC_TELEGRAM_URL }}
        run: |
          npm run build
          php artisan site:export --url="${{ vars.SITE_URL || format('https://{0}.pages.dev', vars.CLOUDFLARE_PROJECT_NAME) }}"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
